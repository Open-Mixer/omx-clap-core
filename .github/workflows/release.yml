name: release

# A version tag builds the RPMs and the DEBs, for x86_64/amd64 and aarch64/arm64, signs them, publishes them
# into the rpm/ and deb/ trees of the OpenMixer Pages repository and attaches the RPMs to the GitHub release.
# Anything else, a manual run from a branch or the dry run of ci.yml, builds and assembles unsigned trees and
# publishes nothing. Everything is in Open-Mixer/.github; the secrets are the organisation's.

# A manual run with staged on (never a tag) builds fc44 x86_64 and trixie amd64 only, against the staging channel, and
# publishes them, signed, to the staging channel (staging/rpm and staging/deb of the channel repository), where the
# next layer of the release chain finds them by adding the staging channel beside the real one. Nothing reaches the
# real channel, and the real release still publishes once from the v<version> tag (Open-Mixer/.github build-rpm.yml
# and build-deb.yml).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Sign and publish; only a run on a tag publishes'
        type: boolean
        default: false
      arm:
        description: 'Build the aarch64/arm64 packages too; a pull request dry run passes false'
        type: boolean
        default: true
      staged:
        description: 'Build fc44 x86_64 and trixie amd64 only and publish them to the staging channel for the next layer; publishes nothing to the real channel'
        type: boolean
        default: false
      staging:
        description: 'Build against the staging channel, above the real one: a dry run only, never a tag or a publish'
        type: boolean
        default: false
      same_pass:
        description: 'Packages other repositories release later in the same pass, space separated; empty reads .github/release-same-pass at the commit built'
        type: string
        default: ''
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      arm:
        type: boolean
        default: true
        description: 'Build the aarch64/arm64 packages too; the pull-request dry run passes false (arm builds run at release only)'
      staged:
        type: boolean
        default: false
      staging:
        description: 'Build against the staging channel, above the real one: a dry run only, never a tag or a publish'
        type: boolean
        default: false
      same_pass:
        description: 'Packages other repositories release in the same pass, space separated (channel-installability)'
        type: string
        default: ''

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  # The packages other repositories release LATER in this same pass, for the channel-installability gate's same-pass
  # (a breakage they cause or suffer is reported, not red): a dispatch's same_pass input, else the tracked
  # .github/release-same-pass at the very commit this run builds (the tag on a push), one package per line, # comments
  # allowed. The file is reviewed like code, lives on its release branch and goes with it; never a repository variable,
  # which is mutable, unversioned and can outlive its pass to excuse a later break. tests/release_same_pass.py holds
  # this wiring to plugin-hostd's.
  samepass:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-same-pass
          sparse-checkout-cone-mode: false
      - id: read
        run: |
          f=.github/release-same-pass
          [ -f "$f" ] || { echo "list=" >>"$GITHUB_OUTPUT"; echo "no $f at this commit: nothing released in the same pass"; exit 0; }
          names=$(sed -e 's/#.*//' "$f" | tr -s ' \t\r\n' '\n' | sed '/^$/d')
          for n in $names; do
            [[ "$n" =~ ^[a-z0-9][a-z0-9.+-]*$ ]] || { echo "::error::$f: '$n' is not a package name"; exit 1; }
          done
          list=$(echo $names)
          echo "list=$list" >>"$GITHUB_OUTPUT"
          echo "same pass from $f: ${list:-none}"

  rpm:
    needs: samepass
    uses: Open-Mixer/.github/.github/workflows/build-rpm.yml@openmixer-v1
    with:
      staged: ${{ inputs.staged == true }}
      staging: ${{ inputs.staging == true }}
      same-pass: ${{ inputs.same_pass || needs.samepass.outputs.list }}
      package-name: omx-clap-host
      publish: ${{ github.event_name == 'push' || inputs.publish == true }}
      arch-matrix: ${{ (github.event_name != 'push' && inputs.arm == false) && '["x86_64"]' || '["x86_64", "aarch64"]' }}
    secrets: inherit

  # or skipped RPM job skips this one, so no DEB is published after a failed RPM.
  # beside the RPMs: the two publish jobs share one concurrency group, so their pushes never race
  deb:
    needs: samepass
    uses: Open-Mixer/.github/.github/workflows/build-deb.yml@openmixer-v1
    with:
      staged: ${{ inputs.staged == true }}
      staging: ${{ inputs.staging == true }}
      same-pass: ${{ inputs.same_pass || needs.samepass.outputs.list }}
      package-name: omx-clap-host
      publish: ${{ github.event_name == 'push' || inputs.publish == true }}
      arch-matrix: ${{ (github.event_name != 'push' && inputs.arm == false) && '["amd64"]' || '["amd64", "arm64"]' }}
    secrets: inherit

  # the generated C API reference, fetched by the website from the release assets
  api-docs:
    if: ${{ github.ref_type == 'tag' }}
    needs: [rpm, deb]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install doxygen
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends doxygen

      - name: Build the HTML and attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          make docs
          version=$(tr -d '[:space:]' < VERSION)
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          tar -czf "omx-clap-core-api-docs-${version}.tar.gz" -C build/docs html
          [ -f "omx-clap-core-api-docs-${version}.tar.gz" ]
          gh release upload "$GITHUB_REF_NAME" omx-clap-core-api-docs-*.tar.gz --clobber
